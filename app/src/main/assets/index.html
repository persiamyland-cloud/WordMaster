<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1b3a"><title>WordMaster</title>
<style>
:root{--navy:#0b1b3a;--navy2:#142b52;--teal:#20c6bd;--teal2:#dff8f5;--ink:#17243b;--muted:#78859b;--bg:#f4f7fb;--line:#e8edf4;--white:#fff;--gold:#f4b84a;--shadow:0 10px 30px rgba(15,35,70,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:92px}.top{background:linear-gradient(145deg,var(--navy),#183760);color:white;padding:23px 21px 27px;border-radius:0 0 27px 27px}.topline{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:.2px}.logo{width:36px;height:36px;border-radius:12px;background:var(--teal);display:grid;place-items:center;color:var(--navy);font-weight:900;font-size:20px}.avatar{width:34px;height:34px;border-radius:50%;background:#ffffff20;display:grid;place-items:center}.welcome{margin-top:25px;font-size:14px;color:#b8c8df}.welcome h1{font-size:24px;line-height:1.2;color:#fff;margin:7px 0 0}.welcome p{margin:8px 0 0;color:#b8c8df;font-size:13px}.content{padding:19px 17px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:3px 2px 12px}.section-head h2{font-size:16px;margin:0;font-weight:800}.small-link{font-size:12px;color:#129f9a;font-weight:700;background:none;padding:5px}.wordday{background:white;border-radius:20px;padding:17px;box-shadow:var(--shadow);position:relative;overflow:hidden}.wordday:after{content:'W';position:absolute;right:8px;top:-30px;font-size:130px;font-weight:900;color:#f0f5f9;z-index:0}.wordday>*{position:relative;z-index:1}.eyebrow{font-size:10px;letter-spacing:1.2px;color:#129f9a;font-weight:800}.wdword{font-size:27px;font-weight:850;margin:8px 0 3px;color:var(--navy)}.ipa{font-size:12px;color:var(--muted)}.persian{font-family:Tahoma,"Segoe UI",sans-serif;direction:rtl;text-align:right}.wdmeaning{font-size:15px;margin-top:10px;font-weight:700}.tag{display:inline-flex;background:#e7f8f6;color:#138e88;border-radius:30px;padding:5px 9px;font-size:10px;font-weight:800;margin-top:11px}.btn-primary{background:var(--teal);color:var(--navy);border-radius:12px;padding:12px 16px;font-weight:800}.wd-actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.grid-cats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cat{background:white;border-radius:15px;padding:12px 4px;text-align:center;box-shadow:0 4px 14px #142b5208}.cat .emoji{font-size:21px}.cat span{display:block;font-size:10px;font-weight:700;margin-top:7px}.goal{background:var(--navy);color:white;border-radius:19px;padding:16px;display:flex;align-items:center;gap:14px}.ring{width:58px;height:58px;border-radius:50%;border:5px solid #ffffff35;border-top-color:var(--teal);display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}.goal p{margin:4px 0 0;color:#b7c6da;font-size:11px}.goal strong{font-size:14px}.progressbar{height:6px;background:#ffffff25;border-radius:8px;margin-top:10px;overflow:hidden}.progressbar i{display:block;height:100%;background:var(--teal);width:35%;border-radius:8px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:76px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}.nav button{background:none;color:#99a4b4;font-size:9px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:53px}.nav button b{font-size:20px;font-weight:500}.nav button.active{color:#109f99}.page-title{font-size:23px;font-weight:850;color:var(--navy);margin:4px 0 5px}.sub{font-size:12px;color:var(--muted);margin:0 0 17px}.search{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:13px;background:white;outline:none;margin:8px 0 13px}.search:focus{border-color:var(--teal)}.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 12px}.chip{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:30px;padding:8px 12px;font-size:11px;color:#647188;font-weight:700}.chip.active{background:var(--navy);color:white;border-color:var(--navy)}.word-card{background:white;border-radius:21px;padding:21px;box-shadow:var(--shadow);margin-top:8px}.cardtop{display:flex;justify-content:space-between;align-items:center}.level{font-size:10px;color:#148e88;background:var(--teal2);padding:6px 9px;border-radius:20px;font-weight:800}.heart{background:#f6f8fb;border-radius:50%;width:36px;height:36px;color:#8490a2;font-size:18px}.heart.on{color:#ef6681;background:#fff0f3}.bigword{font-size:34px;font-weight:900;color:var(--navy);margin:14px 0 2px;letter-spacing:-1px}.phonetics{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.phon{background:#f5f7fa;padding:8px 10px;border-radius:10px;font-size:11px;color:#627087}.phon b{display:block;font-size:9px;color:#109f99;margin-bottom:3px}.audio-row{display:flex;gap:8px;margin:12px 0}.audio{background:#eef3f8;color:#8793a5;border-radius:10px;padding:10px;flex:1;font-size:11px;font-weight:700}.audio:disabled{opacity:.75}.meaning{font-size:19px;font-weight:800;margin:15px 0 5px}.definition{font-size:13px;line-height:1.6;color:#657187}.example{background:#f5f8fb;border-radius:13px;padding:13px;margin-top:13px;font-size:13px;line-height:1.6}.example .persian{margin-top:7px;color:#5d6d83}.card-controls{display:flex;align-items:center;justify-content:space-between;margin-top:17px}.outline{background:white;border:1px solid var(--line);border-radius:11px;padding:11px 17px;color:var(--navy);font-weight:800}.counter{font-size:11px;color:var(--muted)}.listitem{background:white;border-radius:14px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;box-shadow:0 3px 12px #142b5208}.listitem strong{font-size:15px}.listitem small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.listitem .persian{font-size:13px;color:#526078}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:white;border-radius:16px;padding:16px;box-shadow:var(--shadow)}.stat strong{font-size:25px;color:var(--navy);display:block}.stat span{font-size:11px;color:var(--muted)}.quizbox{background:white;border-radius:20px;padding:20px;box-shadow:var(--shadow)}.qword{font-size:25px;font-weight:900;color:var(--navy);margin:13px 0}.option{width:100%;text-align:left;background:#f5f7fa;border:1px solid transparent;padding:14px;border-radius:12px;margin:6px 0;color:var(--ink);font-weight:650}.option.correct{background:#e5f8f1;border-color:#54c99a}.option.wrong{background:#fff0f1;border-color:#ef8995}.muted{color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:35px 10px;font-size:13px}.hide{display:none!important}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:11px 16px;border-radius:12px;font-size:12px;z-index:20;box-shadow:var(--shadow)}
</style></head><body><div class="app" id="app"></div><nav class="nav" id="nav"><button data-page="home" class="active"><b>⌂</b>Home</button><button data-page="cards"><b>▤</b>Cards</button><button data-page="dictionary"><b>⌕</b>Dictionary</button><button data-page="quiz"><b>✦</b>Quiz</button><button data-page="favorites"><b>♡</b>Saved</button><button data-page="progress"><b>◷</b>Progress</button></nav><div id="toast" class="toast hide"></div>
<script>
const words=[
{word:'resilient',us:'/rɪˈzɪliənt/',uk:'/rɪˈzɪliənt/',fa:'تاب‌آور، مقاوم',def:'Able to recover quickly after difficulties or setbacks.',pos:'adjective',level:'C1',cat:'Personality',ex:'She remained resilient despite many challenges.',exfa:'او با وجود چالش‌های فراوان مقاوم و استوار باقی ماند.'},
{word:'curious',us:'/ˈkjʊriəs/',uk:'/ˈkjʊəriəs/',fa:'کنجکاو',def:'Eager to know or learn something.',pos:'adjective',level:'A2',cat:'Personality',ex:'Children are naturally curious about the world.',exfa:'کودکان ذاتاً دربارهٔ جهان کنجکاو هستند.'},
{word:'achieve',us:'/əˈtʃiːv/',uk:'/əˈtʃiːv/',fa:'به دست آوردن، دست یافتن',def:'To succeed in doing or getting something after effort.',pos:'verb',level:'B1',cat:'Education',ex:'You can achieve your goals with consistent practice.',exfa:'با تمرین مداوم می‌توانی به اهداف خود برسی.'},
{word:'efficient',us:'/ɪˈfɪʃənt/',uk:'/ɪˈfɪʃənt/',fa:'کارآمد، بهینه',def:'Working well without wasting time, energy, or resources.',pos:'adjective',level:'B2',cat:'Business',ex:'This is a more efficient way to manage your time.',exfa:'این روش کارآمدتری برای مدیریت زمان است.'},
{word:'device',us:'/dɪˈvaɪs/',uk:'/dɪˈvaɪs/',fa:'دستگاه، وسیله',def:'A piece of equipment made for a particular purpose.',pos:'noun',level:'A2',cat:'Technology',ex:'Most students use a digital device to study.',exfa:'بیشتر دانش‌آموزان برای مطالعه از یک دستگاه دیجیتال استفاده می‌کنند.'},
{word:'destination',us:'/ˌdestɪˈneɪʃən/',uk:'/ˌdestɪˈneɪʃən/',fa:'مقصد',def:'The place to which someone or something is going.',pos:'noun',level:'B1',cat:'Travel',ex:'Rome is our final destination.',exfa:'رم مقصد نهایی ماست.'},
{word:'ingredient',us:'/ɪnˈɡriːdiənt/',uk:'/ɪnˈɡriːdiənt/',fa:'مادهٔ تشکیل‌دهنده',def:'One of the things used to make a particular food or product.',pos:'noun',level:'B1',cat:'Food',ex:'Fresh tomatoes are the main ingredient in this sauce.',exfa:'گوجه‌فرنگی تازه مادهٔ اصلی این سس است.'},
{word:'symptom',us:'/ˈsɪmptəm/',uk:'/ˈsɪmptəm/',fa:'نشانه، علامت بیماری',def:'A physical or mental feature that indicates a condition or disease.',pos:'noun',level:'B2',cat:'Health',ex:'A high temperature can be a symptom of infection.',exfa:'تب بالا می‌تواند نشانه‌ای از عفونت باشد.'},
{word:'generous',us:'/ˈdʒenərəs/',uk:'/ˈdʒenərəs/',fa:'بخشنده، سخاوتمند',def:'Willing to give money, help, or time to others.',pos:'adjective',level:'B1',cat:'Personality',ex:'Our neighbours are always generous with their time.',exfa:'همسایه‌های ما همیشه در وقت خود سخاوتمند هستند.'},
{word:'analyze',us:'/ˈænəlaɪz/',uk:'/ˈænəlaɪz/',fa:'تحلیل کردن',def:'To examine something carefully in order to understand it.',pos:'verb',level:'B2',cat:'Education',ex:'Students analyze the results before writing a report.',exfa:'دانش‌آموزان پیش از نوشتن گزارش، نتایج را تحلیل می‌کنند.'},
{word:'sustainable',us:'/səˈsteɪnəbəl/',uk:'/səˈsteɪnəbəl/',fa:'پایدار، بادوام',def:'Able to continue over time without damaging the environment or using up resources.',pos:'adjective',level:'C1',cat:'Technology',ex:'Cities need more sustainable transport systems.',exfa:'شهرها به سیستم‌های حمل‌ونقل پایدارتر نیاز دارند.'},
{word:'negotiate',us:'/nɪˈɡoʊʃieɪt/',uk:'/nɪˈɡəʊʃieɪt/',fa:'مذاکره کردن',def:'To discuss something in order to reach an agreement.',pos:'verb',level:'C1',cat:'Business',ex:'They negotiated a better price with the supplier.',exfa:'آن‌ها با تأمین‌کننده دربارهٔ قیمت بهتر مذاکره کردند.'}
];
words.forEach(w=>{w.americanAudioRef='';w.britishAudioRef='';});
const cats=[['Daily English','☀️'],['Personality','😊'],['Education','🎓'],['Technology','💻'],['Business','💼'],['Travel','✈️'],['Food','🍎'],['Health','🌿']];let page='home',idx=0,filter='All',catFilter='All',query='',quizIndex=0,score=0,quizCorrect=0,quizCount=0,answered=false;
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let favs=get('wm_favs',[]),learned=get('wm_learned',[]),daily=get('wm_daily',0),quizScores=get('wm_scores',[]);
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hide');setTimeout(()=>$('#toast').classList.add('hide'),1900)}
function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
function header(title,sub='Build your English, one word at a time.'){return `<h1 class="page-title">${title}</h1><p class="sub">${sub}</p>`}
function home(){let w=words[0],pct=Math.min(100,Math.round(daily/10*100));return `<div class="top"><div class="topline"><div class="brand"><div class="logo">W</div>WordMaster</div><div class="avatar">✦</div></div><div class="welcome">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase()}<h1>Grow your vocabulary.<br>Unlock your confidence.</h1><p>Small steps today. Fluent conversations tomorrow.</p></div></div><div class="content"><div class="section-head"><h2>Word of the day</h2><span class="tag">FEATURED</span></div><div class="wordday"><div class="eyebrow">TODAY'S WORD · C1</div><div class="wdword">${w.word}</div><div class="ipa">US ${w.us} &nbsp; UK ${w.uk}</div><div class="wdmeaning persian">${w.fa}</div><div class="wd-actions"><span class="tag">${w.cat}</span><button class="btn-primary" onclick="setPage('cards');idx=0">Explore word →</button></div></div><div class="section-head" style="margin-top:23px"><h2>Explore categories</h2><button class="small-link" onclick="setPage('categories')">See all</button></div><div class="grid-cats">${cats.slice(0,8).map(c=>`<button class="cat" onclick="catFilter='${c[0]}';setPage('cards')"><div class="emoji">${c[1]}</div><span>${c[0]}</span></button>`).join('')}</div><div class="section-head" style="margin-top:23px"><h2>Your daily goal</h2><span class="muted" style="font-size:11px">${daily}/10 words</span></div><div class="goal"><div class="ring">${pct}%</div><div style="flex:1"><strong>You're building a great habit!</strong><p>Learn 10 words today to reach your goal.</p><div class="progressbar"><i style="width:${pct}%"></i></div></div></div><div class="section-head" style="margin-top:22px"><h2>Your learning</h2><button class="small-link" onclick="setPage('progress')">View progress</button></div><div class="stats"><div class="stat"><strong>${learned.length}</strong><span>Words learned</span></div><div class="stat"><strong>${favs.length}</strong><span>Saved words</span></div></div></div>`}
function card(){let w=words[idx%words.length],is=favs.includes(w.word);return `<div class="content">${header('Flashcards','Explore words, meanings and real-life examples.')}<div class="filters">${['All','A1','A2','B1','B2','C1','C2'].map(x=>`<button class="chip ${filter===x?'active':''}" onclick="filter='${x}';idx=0;render()">${x}</button>`).join('')}</div><div class="filters">${['All',...cats.map(c=>c[0])].map(x=>`<button class="chip ${catFilter===x?'active':''}" onclick="catFilter='${x}';idx=0;render()">${x}</button>`).join('')}</div>${(()=>{let arr=filtered();if(!arr.length)return '<div class="empty">No words in this selection yet.</div>';let actual=arr[idx%arr.length];return `<div class="word-card"><div class="cardtop"><span class="level">${actual.level} · ${actual.pos}</span><button class="heart ${favs.includes(actual.word)?'on':''}" onclick="toggleFav('${actual.word}')">${favs.includes(actual.word)?'♥':'♡'}</button></div><div class="bigword">${actual.word}</div><div class="phonetics"><div class="phon"><b>AMERICAN IPA</b>${actual.us}</div><div class="phon"><b>BRITISH IPA</b>${actual.uk}</div></div><div class="audio-row"><button class="audio" disabled title="Audio source not connected">◖)) American audio · Soon</button><button class="audio" disabled title="Audio source not connected">◖)) British audio · Soon</button></div><div class="meaning persian">${actual.fa}</div><div class="definition">${actual.def}</div><div class="example"><b>Example</b><br>${actual.ex}<div class="persian">${actual.exfa}</div></div><div class="card-controls"><button class="outline" onclick="move(-1)">← Previous</button><span class="counter">${(idx%arr.length)+1} / ${arr.length}</span><button class="btn-primary" onclick="move(1)">Next →</button></div></div>`})()}</div>`}
function filtered(){return words.filter(w=>(filter==='All'||w.level===filter)&&(catFilter==='All'||catFilter==='Daily English'||w.cat===catFilter))}function move(n){let a=filtered();if(!a.length)return;idx=(idx+n+a.length)%a.length;let w=a[idx];if(!learned.includes(w.word)){learned.push(w.word);save('wm_learned',learned);daily++;save('wm_daily',daily)}render()}
function toggleFav(word){favs=favs.includes(word)?favs.filter(x=>x!==word):[...favs,word];save('wm_favs',favs);render();toast(favs.includes(word)?'Added to your favorites':'Removed from favorites')}
function dictionary(){let list=words.filter(w=>w.word.includes(query.toLowerCase())||w.fa.includes(query));return `<div class="content">${header('Dictionary','Find a word and explore its meaning.')}<input class="search" placeholder="Search English or Persian…" value="${esc(query)}" oninput="query=this.value;renderDictionary()"><div id="dict-results">${dictResults(list)}</div></div>`}
function dictResults(list){return list.length?list.map(w=>`<div class="listitem" onclick="idx=words.indexOf(words.find(x=>x.word==='${w.word}'));filter='All';catFilter='All';setPage('cards')"><div><strong>${w.word}</strong><small>${w.level} · ${w.pos} · ${w.cat}</small></div><div class="persian">${w.fa}</div></div>`).join(''):'<div class="empty">No matching words found.</div>'}
function renderDictionary(){let el=$('#dict-results');if(el)el.innerHTML=dictResults(words.filter(w=>w.word.includes(query.toLowerCase())||w.fa.includes(query)))}
function favorites(){let list=words.filter(w=>favs.includes(w.word));return `<div class="content">${header('Favorites','Your personal collection of useful words.')}${list.length?list.map(w=>`<div class="listitem"><div onclick="idx=words.indexOf(words.find(x=>x.word==='${w.word}'));setPage('cards')"><strong>${w.word}</strong><small>${w.level} · ${w.def.slice(0,55)}…</small></div><div style="display:flex;gap:10px;align-items:center"><span class="persian">${w.fa}</span><button class="heart on" onclick="toggleFav('${w.word}')">♥</button></div></div>`).join(''):'<div class="empty">♡<br><br>No saved words yet.<br>Tap the heart on any flashcard to save it.</div>'}</div>`}
function quiz(){let w=words[quizIndex%words.length],opts=[w.fa,...words.filter(x=>x.word!==w.word).slice(quizIndex%5,quizIndex%5+3).map(x=>x.fa)];while(opts.length<4)opts.push(words[(quizIndex+opts.length)%words.length].fa);opts.sort((a,b)=>((a.charCodeAt(0)+quizIndex)%7)-((b.charCodeAt(0)+quizIndex)%7));return `<div class="content">${header('Quick quiz','Test what you know and strengthen your memory.')}<div class="quizbox"><div class="cardtop"><span class="level">VOCABULARY CHECK</span><span class="counter">Question ${quizIndex+1}</span></div><div class="qword">${w.word}</div><div class="muted" style="font-size:13px;margin-bottom:12px">Choose the correct Persian meaning:</div>${opts.map(o=>`<button class="option" onclick="answerQuiz(this,'${esc(o)}','${esc(w.fa)}')">${o}</button>`).join('')}<div id="quiz-feedback" class="muted" style="font-size:12px;margin-top:10px;min-height:18px"></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:15px"><span class="counter">Score: ${score}</span><button class="btn-primary" onclick="nextQuiz()">Next question →</button></div></div></div>`}
function answerQuiz(el,chosen,right){if(answered)return;answered=true;document.querySelectorAll('.option').forEach(b=>{if(b.textContent===right)b.classList.add('correct')});if(chosen===right){score++;quizCorrect++;$('#quiz-feedback').textContent='Correct! Great work.'}else{el.classList.add('wrong');$('#quiz-feedback').textContent='Not quite. The correct answer is '+right+'.'}}function nextQuiz(){if(answered){quizCount++;quizIndex++;answered=false;if(quizCount>=5){quizScores.push(Math.round(quizCorrect/5*100));save('wm_scores',quizScores);toast('Quiz complete: '+Math.round(quizCorrect/5*100)+'%');quizCount=0;quizCorrect=0;score=0}render()}else toast('Choose an answer first')}
function progress(){let avg=quizScores.length?Math.round(quizScores.reduce((a,b)=>a+b,0)/quizScores.length):0;return `<div class="content">${header('Your progress','Every word you learn is a step forward.')}<div class="stats"><div class="stat"><strong>${learned.length}</strong><span>Words learned</span></div><div class="stat"><strong>${favs.length}</strong><span>Favorite words</span></div><div class="stat"><strong>${quizScores.length}</strong><span>Quizzes completed</span></div><div class="stat"><strong>${avg}%</strong><span>Average quiz score</span></div></div><div class="section-head" style="margin-top:23px"><h2>Daily learning goal</h2><span class="muted" style="font-size:11px">${daily}/10</span></div><div class="goal"><div class="ring">${Math.min(100,daily*10)}%</div><div style="flex:1"><strong>Keep your streak alive</strong><p>Your daily target is 10 new words.</p><div class="progressbar"><i style="width:${Math.min(100,daily*10)}%"></i></div></div></div><div class="section-head" style="margin-top:23px"><h2>Learning by level</h2></div>${['A1','A2','B1','B2','C1','C2'].map(l=>{let n=learned.filter(x=>words.find(w=>w.word===x)?.level===l).length;return `<div class="listitem"><div><strong>${l}</strong><small>${n} words learned</small></div><span class="level">${n} / ${words.filter(w=>w.level===l).length}</span></div>`}).join('')}<p class="muted" style="font-size:10px;margin-top:18px">Progress is stored on this device. Sample vocabulary only.</p></div>`}
function categories(){return `<div class="content">${header('Categories','Choose a topic and start learning.')}<div class="grid-cats">${cats.map(c=>`<button class="cat" style="padding:18px 5px" onclick="catFilter='${c[0]}';filter='All';idx=0;setPage('cards')"><div class="emoji">${c[1]}</div><span>${c[0]}</span></button>`).join('')}</div><div class="section-head" style="margin-top:24px"><h2>CEFR learning levels</h2></div>${[['A1','Beginner','Basic everyday words'],['A2','Elementary','Familiar topics and phrases'],['B1','Intermediate','Work, study and travel'],['B2','Upper intermediate','Complex ideas and discussions'],['C1','Advanced','Fluent, flexible vocabulary'],['C2','Proficient','Precise and nuanced language']].map(x=>`<div class="listitem"><div><strong>${x[0]} · ${x[1]}</strong><small>${x[2]}</small></div><span class="level">${words.filter(w=>w.level===x[0]).length} words</span></div>`).join('')}</div>`}
function render(){let html=page==='home'?home():page==='cards'?card():page==='dictionary'?dictionary():page==='quiz'?quiz():page==='favorites'?favorites():page==='progress'?progress():categories();$('#app').innerHTML=html;}
render();
</script></body></html>
